name: Daily digest
 
on:
  schedule:
    - cron: "0 6 * * *"   # 11:00 UTC = 6am EST / 7am EDT (GitHub may run it a few minutes late)
  workflow_dispatch:        # lets you run it by hand from the Actions tab
 
permissions:
  contents: write           # needed to commit digest.json
 
concurrency:
  group: daily-digest
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - run: pip install requests
 
      - name: Build digest
        env:
          DIGEST_JSON_PATH: digest.json
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
          MUSICBRAINZ_CONTACT: ${{ secrets.MUSICBRAINZ_CONTACT }}
          # Optional: keep these only if you still want the Notion page + phone alert
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          NOTION_USER_ID: ${{ secrets.NOTION_USER_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python daily_digest_generator.py
 
      - name: Commit digest.json
        run: |
          if git diff --quiet -- digest.json && [ -n "$(git ls-files digest.json)" ]; then
            echo "No changes."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest.json
          git commit -m "Update daily digest"
          git push
